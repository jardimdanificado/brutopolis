<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brutopolis 3D — RollerCoaster Tycoon Style Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111418;
      font-family: 'VT323', monospace;
      color: #e0e6ed;
    }
    #viewport-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    /* Top RCT Style Banner */
    .rct-header {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: linear-gradient(180deg, #3d5a80 0%, #1d2d44 100%);
      border: 3px solid #748cab;
      border-radius: 6px;
      padding: 6px 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 20px;
    }
    .rct-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: #ffd166;
      text-shadow: 1px 1px 0px #000;
    }
    /* Bottom Controls */
    .rct-toolbar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: #1a222d;
      border: 2px solid #3e4c5e;
      border-radius: 8px;
      padding: 8px 14px;
      display: flex;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.7);
    }
    .rct-btn {
      background: linear-gradient(180deg, #4f5d75 0%, #2d3142 100%);
      border: 2px outset #bfc0c0;
      color: #ffffff;
      padding: 6px 12px;
      font-family: 'VT323', monospace;
      font-size: 20px;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: filter 0.1s;
    }
    .rct-btn:hover {
      filter: brightness(1.2);
    }
    .rct-btn:active {
      border-style: inset;
      filter: brightness(0.9);
    }
    /* Inspection Card */
    #inspect-panel {
      position: absolute;
      top: 60px;
      right: 16px;
      width: 260px;
      z-index: 10;
      background: rgba(26, 34, 45, 0.95);
      border: 2px solid #ffd166;
      border-radius: 6px;
      padding: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      display: none;
    }
    .inspect-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: #ffd166;
      margin-bottom: 8px;
      border-bottom: 1px solid #3e4c5e;
      padding-bottom: 4px;
    }
    .inspect-stat {
      font-size: 18px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .inspect-val {
      color: #06d6a0;
    }
    /* Guide Overlay */
    .controls-hint {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(15, 20, 25, 0.85);
      border: 1px solid #3e4c5e;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 16px;
      line-height: 1.3;
      color: #a0aec0;
    }
    .key {
      background: #2d3748;
      border: 1px solid #4a5568;
      border-radius: 3px;
      padding: 1px 5px;
      color: #edf2f7;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div id="viewport-container"></div>

  <!-- Header -->
  <div class="rct-header">
    <span class="rct-title">🏰 BRUTOPOLIS 3D (RCT EDITION)</span>
    <span id="pop-counter">Pop: 0</span>
    <span id="tps-counter">60 FPS</span>
  </div>

  <!-- Bottom Toolbar -->
  <div class="rct-toolbar">
    <button class="rct-btn" id="btn-wire">📐 Wireframe</button>
    <button class="rct-btn" id="btn-zoom-in">➕ Zoom In</button>
    <button class="rct-btn" id="btn-zoom-out">➖ Zoom Out</button>
    <button class="rct-btn" id="btn-spawn">⚔️ Spawn Aldeão</button>
    <button class="rct-btn" id="btn-pause">⏸️ Pausar</button>
    <a href="index.html" class="rct-btn" style="text-decoration: none;">📺 Modo Clássico 2D</a>
  </div>

  <!-- Inspection Panel -->
  <div id="inspect-panel">
    <div class="inspect-title" id="inspect-name">INSPEÇÃO</div>
    <div class="inspect-stat"><span>Vida:</span> <span class="inspect-val" id="inspect-hp">100/100</span></div>
    <div class="inspect-stat"><span>Fome:</span> <span class="inspect-val" id="inspect-hunger">0%</span></div>
    <div class="inspect-stat"><span>Ação:</span> <span class="inspect-val" id="inspect-action">Vagando</span></div>
    <div class="inspect-stat"><span>Posição:</span> <span class="inspect-val" id="inspect-pos">X: 0, Y: 0</span></div>
  </div>

  <!-- Key Hints -->
  <div class="controls-hint">
    <div><span class="key">WASD</span> ou <span class="key">Arrastar</span>: Mover Câmera</div>
    <div><span class="key">Q</span> / <span class="key">E</span>: Rotação Isométrica 90°</div>
    <div><span class="key">Scroll</span>: Zoom In/Out</div>
    <div><span class="key">Clique</span>: Selecionar e Inspecionar Criatura</div>
  </div>

  <script type="module">
    import { World } from "./js/world.js";
    import { RCT3DRenderer } from "./js/renderer_rct.js";
    import { 
      createEntity, 
      tickEntities, 
      entityRegistry, 
      getEntityById 
    } from "./js/engine.js";
    import {
      createHuman,
      createKnight,
      createElf,
      createDwarf,
      createOrc,
      createBoar,
      createWolf,
      createBear,
      createDragon,
      createOakTree,
      createPineTree,
      createWillowTree,
      createHouseEntity,
      createStoneWallEntity
    } from "./js/properties.js";

    const container = document.getElementById("viewport-container");
    const rctRenderer = new RCT3DRenderer(container);

    // 1. Create and generate Continent World
    const world = new World(1, 1337);
    const spawnX = world.spawnCenter?.x || 512;
    const spawnY = world.spawnCenter?.y || 512;

    // 2. Position Camera at spawn center
    rctRenderer.setCamera(spawnX, spawnY, 1.2);

    // 3. Spawn Initial Living Settlement & Wildlife
    const entities = [];
    const archetypes = [createKnight, createHuman, createElf, createDwarf, createOrc, createBoar, createWolf, createBear, createDragon];

    // Spawn sample house and walls
    const house = createHouseEntity(spawnX, spawnY, 1, "Vila Real");
    if (house) entities.push(house);

    // Spawn trees
    for (let i = 0; i < 25; i++) {
      const tx = spawnX + Math.floor((Math.random() - 0.5) * 40);
      const ty = spawnY + Math.floor((Math.random() - 0.5) * 40);
      if (world.getTile(tx, ty) === 0) { // TILE_FLOOR
        const treeFunc = Math.random() < 0.5 ? createOakTree : createPineTree;
        if (typeof treeFunc === "function") {
          const t = treeFunc(tx, ty);
          if (t) entities.push(t);
        }
      }
    }

    // Spawn creatures
    for (let i = 0; i < 45; i++) {
      const rx = spawnX + Math.floor((Math.random() - 0.5) * 35);
      const ry = spawnY + Math.floor((Math.random() - 0.5) * 35);
      if (world.getTile(rx, ry) !== 2) { // Not water
        const arch = archetypes[i % archetypes.length];
        const ent = arch(rx, ry);
        if (ent) entities.push(ent);
      }
    }

    // UI elements
    const popCounter = document.getElementById("pop-counter");
    const tpsCounter = document.getElementById("tps-counter");
    const inspectPanel = document.getElementById("inspect-panel");
    const inspectName = document.getElementById("inspect-name");
    const inspectHp = document.getElementById("inspect-hp");
    const inspectHunger = document.getElementById("inspect-hunger");
    const inspectAction = document.getElementById("inspect-action");
    const inspectPos = document.getElementById("inspect-pos");

    let isPaused = false;
    let lastTime = performance.now();
    let frameCount = 0;
    let lastFpsTime = performance.now();

    // Mouse drag navigation
    let isMouseDown = false;
    let lastMouseX = 0;
    let lastMouseY = 0;
    let dragDist = 0;

    window.addEventListener("mousedown", (e) => {
      if (e.target.closest(".rct-toolbar") || e.target.closest(".rct-header") || e.target.closest("#inspect-panel")) return;
      isMouseDown = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      dragDist = 0;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isMouseDown) return;
      const dx = e.clientX - lastMouseX;
      const dy = e.clientY - lastMouseY;
      dragDist += Math.abs(dx) + Math.abs(dy);
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;

      // Pan camera aligned with isometric rotation
      const rot = rctRenderer.currentRotationY;
      const speed = 0.08 / rctRenderer.getCameraZoom();
      
      const moveX = (-dx * Math.cos(rot) - dy * Math.sin(rot)) * speed;
      const moveY = (dx * Math.sin(rot) - dy * Math.cos(rot)) * speed;

      rctRenderer.setCamera(
        rctRenderer.getCameraX() + moveX,
        rctRenderer.getCameraY() + moveY,
        rctRenderer.getCameraZoom()
      );
    });

    window.addEventListener("mouseup", (e) => {
      if (isMouseDown && dragDist < 6) {
        const id = rctRenderer.selectAt(e.clientX, e.clientY, entities);
        if (id !== -1) {
          updateInspectionPanel(id);
        } else {
          inspectPanel.style.display = "none";
        }
      }
      isMouseDown = false;
    });

    // Zoom with mouse wheel
    window.addEventListener("wheel", (e) => {
      const current = rctRenderer.getCameraZoom();
      const next = e.deltaY < 0 ? current * 1.15 : current / 1.15;
      rctRenderer.setCamera(rctRenderer.getCameraX(), rctRenderer.getCameraY(), next);
    }, { passive: true });

    // Keyboard shortcuts
    window.addEventListener("keydown", (e) => {
      const step = 2.5 / rctRenderer.getCameraZoom();
      const rot = Math.PI / 4;
      let mx = 0, my = 0;
      if (e.key === "w" || e.key === "W" || e.key === "ArrowUp") my -= step;
      if (e.key === "s" || e.key === "S" || e.key === "ArrowDown") my += step;
      if (e.key === "a" || e.key === "A" || e.key === "ArrowLeft") mx -= step;
      if (e.key === "d" || e.key === "D" || e.key === "ArrowRight") mx += step;

      if (mx !== 0 || my !== 0) {
        const moveX = (mx * Math.cos(rot) - my * Math.sin(rot));
        const moveY = (mx * Math.sin(rot) + my * Math.cos(rot));
        rctRenderer.setCamera(rctRenderer.getCameraX() + moveX, rctRenderer.getCameraY() + moveY, rctRenderer.getCameraZoom());
      }
    });

    document.getElementById("btn-wire").onclick = () => rctRenderer.toggleWireframe();
    document.getElementById("btn-zoom-in").onclick = () => {
      rctRenderer.setCamera(rctRenderer.getCameraX(), rctRenderer.getCameraY(), rctRenderer.getCameraZoom() * 1.25);
    };
    document.getElementById("btn-zoom-out").onclick = () => {
      rctRenderer.setCamera(rctRenderer.getCameraX(), rctRenderer.getCameraY(), rctRenderer.getCameraZoom() / 1.25);
    };
    document.getElementById("btn-spawn").onclick = () => {
      const arch = archetypes[Math.floor(Math.random() * archetypes.length)];
      const ent = arch(rctRenderer.getCameraX() + (Math.random()-0.5)*8, rctRenderer.getCameraY() + (Math.random()-0.5)*8);
      if (ent) entities.push(ent);
    };
    document.getElementById("btn-pause").onclick = (e) => {
      isPaused = !isPaused;
      e.target.textContent = isPaused ? "▶️ Retomar" : "⏸️ Pausar";
    };

    function updateInspectionPanel(id) {
      const ent = getEntityById(id);
      if (!ent) {
        inspectPanel.style.display = "none";
        return;
      }
      inspectPanel.style.display = "block";
      inspectName.textContent = ent.properties?.name || "CRIATURA #" + ent.id;
      
      const hp = ent.properties?.life?.energy || 100;
      const maxHp = ent.properties?.life?.max || 100;
      inspectHp.textContent = `${Math.round(hp)} / ${maxHp}`;
      
      const hunger = ent.properties?.stomach ? Math.round((1 - ent.properties.stomach.energy / 100) * 100) : 0;
      inspectHunger.textContent = `${hunger}%`;
      
      const motorNames = ["Parado", "Andando", "Bebendo", "Comendo", "Dormindo", "Atacando", "Fugindo", "Socializando"];
      inspectAction.textContent = motorNames[ent.motor] || "Vagando";
      inspectPos.textContent = `X: ${Math.round(ent.x)}, Y: ${Math.round(ent.y)}`;
    }

    window.addEventListener("resize", () => {
      rctRenderer.resize(window.innerWidth, window.innerHeight);
    });

    // Main Game Loop
    function gameLoop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      // Tick Simulation
      if (!isPaused) {
        tickEntities(entities, Math.min(dt, 0.1), world);
      }

      // Render 3D Frame
      rctRenderer.render(world, entities, now * 0.001, dt, 1.0);

      // Keep Inspector fresh
      if (rctRenderer.selectedEntityId !== -1) {
        updateInspectionPanel(rctRenderer.selectedEntityId);
      }

      // Stats
      frameCount++;
      if (now - lastFpsTime >= 1000) {
        tpsCounter.textContent = `${frameCount} FPS`;
        popCounter.textContent = `Pop: ${entities.filter(e => !e.destroyed).length}`;
        frameCount = 0;
        lastFpsTime = now;
      }

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
